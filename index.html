<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يوميات رندة في نابلس 🌸</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ec4899">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdf2f8; margin: 0; padding: 0; }
        .post-card { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #splashScreen { transition: opacity 1s ease-out; }
    </style>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbeaZNjAV2pr2KU52QSnxL9zF3GMJfQjM",
            authDomain: "randa-nablus.firebaseapp.com",
            projectId: "randa-nablus",
            storageBucket: "randa-nablus.firebasestorage.app",
            messagingSenderId: "433006813795",
            appId: "1:433006813795:web:df63f875d11621e2040e56",
            measurementId: "G-MWD3BHDSLC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
    </script>
</head>
<body class="pb-20">

    <!-- شريط وضع الزائر (لصديقات رندة) -->
    <div id="viewerNotice" class="hidden bg-pink-500 text-white text-center py-2 px-4 font-bold text-sm sticky top-0 z-50 shadow-md">
        🌸 أهلاً بكِ! أنتِ تتصفحين ألبوم رندة العام 🌸
    </div>

    <!-- شاشة البداية (10 ثوانٍ) -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-pink-500 flex flex-col items-center justify-center text-white">
        <img src="splash.jpg" alt="رندة في نابلس" class="w-48 h-48 object-cover rounded-full border-4 border-white shadow-xl mb-6">
        <h1 class="text-4xl font-bold mb-2">يوميات رندة</h1>
        <p class="text-xl opacity-90">أحلى الأوقات في نابلس 🌸</p>
        <div class="mt-8 flex gap-2">
            <div class="w-3 h-3 bg-white rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-pink-500 text-white p-4 shadow-md sticky top-0 z-10 text-center rounded-b-3xl">
        <h1 class="text-2xl font-bold">يوميات رندة 🌸</h1>
        <p class="text-sm opacity-90">ديباك! توثيق أحلى اللحظات</p>
    </header>

    <main class="p-4 max-w-md mx-auto mt-2">
        <!-- Add Post Section (Admin Only) -->
        <div id="addPostForm" class="bg-white p-5 rounded-3xl shadow-sm border border-pink-100 mb-6">
            <h2 id="formTitle" class="text-lg font-bold text-pink-600 mb-4">إضافة يومية جديدة ✨</h2>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button type="button" onclick="document.getElementById('cameraInput').click()" class="bg-pink-50 border-2 border-dashed border-pink-300 rounded-2xl p-4 text-center hover:bg-pink-100 transition flex flex-col items-center justify-center shadow-sm">
                    <span class="text-3xl mb-1">📸</span>
                    <span class="text-xs text-pink-600 font-bold">صوري الآن</span>
                </button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

                <button type="button" onclick="document.getElementById('galleryInput').click()" class="bg-pink-50 border-2 border-dashed border-pink-300 rounded-2xl p-4 text-center hover:bg-pink-100 transition flex flex-col items-center justify-center shadow-sm">
                    <span class="text-3xl mb-1">🖼️</span>
                    <span class="text-xs text-pink-600 font-bold">من الاستديو</span>
                </button>
                <input type="file" id="galleryInput" accept="image/*" class="hidden">
            </div>

            <img id="preview" class="hidden w-full h-56 object-cover rounded-2xl mb-4 shadow-sm border border-gray-100">

            <!-- Arabic Text -->
            <div class="relative mb-3">
                <textarea id="arText" rows="2" class="w-full p-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-pink-300 outline-none resize-none text-gray-700 bg-gray-50" placeholder="اكتبي يومياتك بالعربي أو احكيها بصوتك..."></textarea>
                <button type="button" id="micBtn" class="absolute left-2 bottom-3 bg-pink-500 text-white p-2 rounded-full shadow hover:bg-pink-600 transition flex items-center justify-center" title="احكي بالعربي">🎤</button>
            </div>
            <div id="micStatus" class="text-xs text-pink-500 hidden mb-3 font-bold text-center">جاري الاستماع... احكي براحتك!</div>

            <!-- Korean Text -->
            <div class="relative mb-4">
                <textarea id="koText" rows="2" class="w-full p-4 border border-pink-200 bg-pink-50 rounded-2xl focus:ring-2 focus:ring-pink-300 outline-none resize-none text-left font-medium text-pink-900" dir="ltr" placeholder="الترجمة الكورية رح تطلع هون..."></textarea>
            </div>

            <!-- خيار الخصوصية: خاص أم عام -->
            <div class="mb-4 bg-pink-50 p-3 rounded-2xl border border-pink-100">
                <label class="block text-xs font-bold text-pink-600 mb-2">نوع النشر:</label>
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="privacyOpt" value="private" id="privPrivate" checked class="peer hidden">
                        <div class="p-2.5 text-center text-xs font-bold rounded-xl border border-pink-200 bg-white peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 text-pink-700 transition shadow-sm">
                            🔒 خاص (جهازي فقط)
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="privacyOpt" value="public" id="privPublic" class="peer hidden">
                        <div class="p-2.5 text-center text-xs font-bold rounded-xl border border-pink-200 bg-white peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 text-pink-700 transition shadow-sm">
                            🌐 عام (للصديقات)
                        </div>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="saveBtn" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3.5 rounded-2xl shadow-md hover:opacity-90 transition text-lg flex justify-center items-center gap-2">
                <span>نشر في اليوميات</span> 🚀
            </button>
            <button id="cancelEditBtn" class="hidden w-full mt-2 bg-gray-200 text-gray-700 font-bold py-2 rounded-2xl hover:bg-gray-300 transition text-sm">إلغاء التعديل</button>
        </div>

        <!-- Backup & Share Link Section -->
        <div id="adminBackupSection" class="bg-white p-4 rounded-3xl shadow-sm border border-pink-100 mb-6 flex gap-2">
            <button onclick="backupData()" class="flex-1 bg-pink-50 text-pink-600 font-bold py-2.5 px-2 rounded-2xl border border-pink-200 hover:bg-pink-100 transition text-xs flex items-center justify-center gap-1">
                <span>📦 حفظ نسخة</span>
            </button>
            <button onclick="document.getElementById('restoreFile').click()" class="flex-1 bg-purple-50 text-purple-600 font-bold py-2.5 px-2 rounded-2xl border border-purple-200 hover:bg-purple-100 transition text-xs flex items-center justify-center gap-1">
                <span>📥 استعادة</span>
            </button>
            <button onclick="copyFriendLink()" class="flex-1 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-2.5 px-2 rounded-2xl hover:opacity-90 transition text-xs flex items-center justify-center gap-1 shadow-sm">
                <span>🔗 رابط الصديقات</span>
            </button>
            <input type="file" id="restoreFile" accept=".json" class="hidden" onchange="restoreData(event)">
        </div>

        <!-- Posts Feed -->
        <h3 class="text-gray-600 font-bold mb-4 px-2">ألبوم الذكريات 📸</h3>
        <div id="postsFeed" class="space-y-6"></div>
    </main>

    <script>
        const SECRET_PIN = "201214";
        let isViewerMode = false;

        // شاشة البداية 5 ثوانٍ
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 1000);
                }
            }, 5000);
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.log('Service Worker Error', err));
        }

        const preview = document.getElementById('preview');
        const arText = document.getElementById('arText');
        const koText = document.getElementById('koText');
        const saveBtn = document.getElementById('saveBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const formTitle = document.getElementById('formTitle');
        const postsFeed = document.getElementById('postsFeed');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        
        let currentImageBase64 = '';
        let editingId = null;

        function handleImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    preview.src = currentImageBase64;
                    preview.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('cameraInput').addEventListener('change', handleImage);
        document.getElementById('galleryInput').addEventListener('change', handleImage);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-PS'; 
            recognition.continuous = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micStatus.classList.remove('hidden');
                micStatus.textContent = 'جاري الاستماع... احكي!';
                micBtn.classList.add('animate-pulse', 'bg-red-500');
            });

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                arText.value = transcript;
                micStatus.textContent = 'جاري الترجمة للكوري... ⏳';
                micBtn.classList.remove('animate-pulse', 'bg-red-500');
                
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=ar|ko`);
                    const data = await response.json();
                    if (data && data.responseData) {
                        koText.value = data.responseData.translatedText;
                        micStatus.textContent = 'تمت الترجمة بنجاح! ✅';
                    }
                } catch (error) {
                    micStatus.textContent = 'صار مشكلة بالترجمة، جربي كمان مرة.';
                }
                setTimeout(() => micStatus.classList.add('hidden'), 3000);
            };

            recognition.onerror = () => {
                micStatus.textContent = 'ما سمعت منيح، عيدي بالله! 😅';
                micBtn.classList.remove('animate-pulse', 'bg-red-500');
                setTimeout(() => micStatus.classList.add('hidden'), 3000);
            };
        } else {
            micBtn.style.display = 'none';
        }

        // مزامنة السحاب
        async function syncToCloud(post) {
            if (!window.db) return;
            try {
                if (post.isPublic) {
                    await window.setDoc(window.doc(window.db, "public_posts", String(post.id)), post);
                } else {
                    await window.deleteDoc(window.doc(window.db, "public_posts", String(post.id)));
                }
            } catch(e) {
                console.error("Firebase Sync Error: ", e);
            }
        }

        async function removeFromCloud(postId) {
            if (!window.db) return;
            try {
                await window.deleteDoc(window.doc(window.db, "public_posts", String(postId)));
            } catch(e) {
                console.error("Firebase Remove Error: ", e);
            }
        }

        saveBtn.addEventListener('click', async () => {
            if (!currentImageBase64 && !arText.value && !koText.value) {
                alert('اكتبي إشي أو حطي صورة أول!');
                return;
            }
            
            const isPublicChoice = document.querySelector('input[name="privacyOpt"]:checked').value === 'public';
            let posts = JSON.parse(localStorage.getItem('randa_diary_posts') || '[]');

            let updatedPost = null;

            if (editingId) {
                posts = posts.map(p => {
                    if (p.id === editingId) {
                        updatedPost = {
                            ...p,
                            ar: arText.value,
                            ko: koText.value,
                            image: currentImageBase64 || p.image,
                            isPublic: isPublicChoice
                        };
                        return updatedPost;
                    }
                    return p;
                });
                editingId = null;
                formTitle.textContent = 'إضافة يومية جديدة ✨';
                saveBtn.querySelector('span').textContent = 'نشر في اليوميات';
                cancelEditBtn.classList.add('hidden');
            } else {
                updatedPost = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-PS'),
                    image: currentImageBase64,
                    ar: arText.value,
                    ko: koText.value,
                    isPublic: isPublicChoice
                };
                posts.unshift(updatedPost);
            }

            localStorage.setItem('randa_diary_posts', JSON.stringify(posts));
            await syncToCloud(updatedPost);
            
            currentImageBase64 = ''; 
            preview.classList.add('hidden'); 
            preview.src = ''; 
            arText.value = ''; 
            koText.value = '';
            document.getElementById('privPrivate').checked = true;
            renderPosts();
        });

        cancelEditBtn.addEventListener('click', () => {
            editingId = null;
            formTitle.textContent = 'إضافة يومية جديدة ✨';
            saveBtn.querySelector('span').textContent = 'نشر في اليوميات';
            cancelEditBtn.classList.add('hidden');
            currentImageBase64 = '';
            preview.classList.add('hidden');
            preview.src = '';
            arText.value = '';
            koText.value = '';
            document.getElementById('privPrivate').checked = true;
        });

        window.deletePost = async function(id) {
            if (confirm('متأكدة بدك تحذفي هاي اليومية؟')) {
                let posts = JSON.parse(localStorage.getItem('randa_diary_posts') || '[]');
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('randa_diary_posts', JSON.stringify(posts));
                await removeFromCloud(id);
                renderPosts();
            }
        };

        window.togglePrivacy = async function(id) {
            let posts = JSON.parse(localStorage.getItem('randa_diary_posts') || '[]');
            let changedPost = null;
            posts = posts.map(p => {
                if (p.id === id) {
                    changedPost = { ...p, isPublic: !p.isPublic };
                    return changedPost;
                }
                return p;
            });
            localStorage.setItem('randa_diary_posts', JSON.stringify(posts));
            if (changedPost) {
                await syncToCloud(changedPost);
            }
            renderPosts();
        };

        window.editPost = function(id) {
            const posts = JSON.parse(localStorage.getItem('randa_diary_posts') || '[]');
            const post = posts.find(p => p.id === id);
            if (!post) return;

            editingId = id;
            arText.value = post.ar || '';
            koText.value = post.ko || '';
            if (post.isPublic) {
                document.getElementById('privPublic').checked = true;
            } else {
                document.getElementById('privPrivate').checked = true;
            }

            if (post.image) {
                currentImageBase64 = post.image;
                preview.src = post.image;
                preview.classList.remove('hidden');
            } else {
                currentImageBase64 = '';
                preview.classList.add('hidden');
            }

            formTitle.textContent = 'تعديل اليومية ✍️';
            saveBtn.querySelector('span').textContent = 'حفظ التعديلات';
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.copyFriendLink = function() {
            const link = `${window.location.origin}${window.location.pathname}?mode=view`;
            navigator.clipboard.writeText(link).then(() => {
                alert('🔗 تم نسخ رابط الصديقات بنجاح!\nشاركي الرابط مع صديقاتك ليشوفوا اليوميات العامة فقط.');
            });
        };

        window.backupData = function() {
            const pin = prompt('أدخل الرقم السري للنسخة الاحتياطية:');
            if (pin !== SECRET_PIN) {
                if (pin !== null) alert('الرقم السري غير صحيح! ❌');
                return;
            }
            const posts = localStorage.getItem('randa_diary_posts') || '[]';
            const encryptedData = btoa(encodeURIComponent(posts));
            const blob = new Blob([encryptedData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `randa-nablus-backup-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('تم حفظ النسخة الاحتياطية المشفرة بنجاح! 📦✅');
        };

        window.restoreData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const pin = prompt('أدخل الرقم السري لاستعادة النسخة:');
            if (pin !== SECRET_PIN) {
                alert('الرقم السري غير صحيح! ❌');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const encryptedData = e.target.result;
                    const decryptedData = decodeURIComponent(atob(encryptedData));
                    JSON.parse(decryptedData); 
                    localStorage.setItem('randa_diary_posts', decryptedData);
                    renderPosts();
                    alert('تمت استعادة الذكريات بنجاح تام! 🌸🎉');
                } catch (err) {
                    alert('ملف النسخة الاحتياطية غير صالح أو تالف! ❌');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        };

        window.speakKorean = function(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        };

        function renderPosts(customPosts = null) {
            const posts = customPosts || JSON.parse(localStorage.getItem('randa_diary_posts') || '[]');
            
            const dadSurprisePost = {
                date: 'رسالة خاصة من بابا 🌸',
                image: 'dad-randa.jpg',
                ar: 'ملاكي الصغير رندة.. مهما كبرتي يا بابا، ستظلين تلك الفتاة الصغيرة التي لا تنام إلا حين أغني لها شيئاً رقيقاً كروحها المرحة الجميلة. منورة نابلس يا روح أبوكِ ✨',
                ko: '내 작은 천사 란다.. 네가 얼마나 자라든, 너는 내 목소리를 들으며 잠들던 그 작은 아이란단다. 나블루스에서 가장 예쁜 우리 딸, 대박! 🌸',
                isDad: true
            };

            const allPosts = [dadSurprisePost, ...posts];

            postsFeed.innerHTML = allPosts.map(post => `
                <div class="post-card bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden pb-3 relative">
                    ${(!post.isDad && !isViewerMode) ? `
                        <div class="absolute top-3 left-3 z-10 flex gap-1.5">
                            <button onclick="togglePrivacy(${post.id})" class="bg-white/90 hover:bg-white text-xs px-2.5 py-1.5 rounded-full shadow transition font-bold ${post.isPublic ? 'text-green-600' : 'text-gray-500'}" title="تغيير الخصوصية">
                                ${post.isPublic ? '🌐 عام' : '🔒 خاص'}
                            </button>
                            <button onclick="editPost(${post.id})" class="bg-white/90 hover:bg-white text-blue-600 p-2 rounded-full shadow transition" title="تعديل">✏️</button>
                            <button onclick="deletePost(${post.id})" class="bg-white/90 hover:bg-white text-red-600 p-2 rounded-full shadow transition" title="حذف">🗑️</button>
                        </div>
                    ` : ''}
                    
                    ${post.image ? `<img src="${post.image}" class="w-full h-72 object-cover">` : ''}
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs text-pink-500 font-bold">${post.date}</span>
                            ${(!post.isDad && !isViewerMode) ? `
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${post.isPublic ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
                                    ${post.isPublic ? 'منشور للعامة' : 'خاص بجهازي'}
                                </span>
                            ` : ''}
                        </div>
                        ${post.ar ? `<p class="text-gray-800 font-bold mb-3 text-lg leading-relaxed">${post.ar}</p>` : ''}
                        ${post.ko ? `
                            <div class="bg-pink-50 p-4 rounded-2xl flex justify-between items-center mt-3 border border-pink-100">
                                <p class="text-pink-700 font-medium flex-1 text-left text-lg" dir="ltr">${post.ko}</p>
                                <button onclick="speakKorean('${post.ko.replace(/'/g, "\\'")}')" class="bg-pink-200 text-pink-700 w-10 h-10 flex items-center justify-center rounded-full hover:bg-pink-300 transition ml-3 flex-shrink-0 shadow-sm" title="اسمعي اللفظ">🔊</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // فحص وضع الزائر
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'view') {
                isViewerMode = true;
                document.getElementById('addPostForm').style.display = 'none';
                document.getElementById('adminBackupSection').style.display = 'none';
                document.getElementById('viewerNotice').classList.remove('hidden');

                // الاستماع اللحظي للعام فقط من Firebase
                const checkFirebase = setInterval(() => {
                    if (window.db && window.onSnapshot && window.collection) {
                        clearInterval(checkFirebase);
                        window.onSnapshot(window.collection(window.db, "public_posts"), (snapshot) => {
                            const cloudPosts = snapshot.docs.map(doc => doc.data());
                            cloudPosts.sort((a, b) => b.id - a.id);
                            renderPosts(cloudPosts);
                        });
                    }
                }, 200);
            } else {
                renderPosts();
            }
        });
    </script>
</body>
</html>
